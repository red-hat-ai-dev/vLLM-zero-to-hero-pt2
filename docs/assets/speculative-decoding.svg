<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" role="img" aria-labelledby="title description">
  <title id="title">How speculative decoding works</title>
  <desc id="description">A small draft model proposes tokens, then a larger target model verifies them. Accepted tokens continue generation and a rejected token is replaced by the target model.</desc>
  <rect x="1" y="1" width="1198" height="468" rx="24" fill="#ffffff" stroke="#d2d2d2" stroke-width="2"/>
  <text x="56" y="52" fill="#ee0000" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" letter-spacing="1.5">SPECULATIVE DECODING</text>
  <text x="56" y="91" fill="#151515" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700">Let a small model propose. Let the target decide.</text>
  <text x="56" y="119" fill="#565656" font-family="Arial, Helvetica, sans-serif" font-size="16">The target model remains in control while checking several tokens together.</text>
  <line x1="56" y1="143" x2="1144" y2="143" stroke="#ee0000" stroke-width="3"/>

  <g transform="translate(56 179)">
    <rect width="1088" height="94" rx="14" fill="#f6f6f6" stroke="#d2d2d2" stroke-width="2"/>
    <circle cx="32" cy="47" r="18" fill="#151515"/>
    <text x="32" y="53" fill="#ffffff" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700">1</text>
    <text x="66" y="39" fill="#151515" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700">Draft model proposes</text>
    <text x="66" y="63" fill="#565656" font-family="Arial, Helvetica, sans-serif" font-size="14">A smaller model quickly suggests the next few tokens.</text>
    <g transform="translate(630 24)">
      <rect width="92" height="42" rx="9" fill="#ffffff" stroke="#b7b7b7"/><text x="46" y="27" text-anchor="middle" fill="#151515" font-family="Arial, Helvetica, sans-serif" font-size="14">The</text>
      <rect x="102" width="92" height="42" rx="9" fill="#ffffff" stroke="#b7b7b7"/><text x="148" y="27" text-anchor="middle" fill="#151515" font-family="Arial, Helvetica, sans-serif" font-size="14">model</text>
      <rect x="204" width="92" height="42" rx="9" fill="#ffffff" stroke="#b7b7b7"/><text x="250" y="27" text-anchor="middle" fill="#151515" font-family="Arial, Helvetica, sans-serif" font-size="14">is</text>
      <rect x="306" width="92" height="42" rx="9" fill="#ffffff" stroke="#b7b7b7"/><text x="352" y="27" text-anchor="middle" fill="#151515" font-family="Arial, Helvetica, sans-serif" font-size="14">fast</text>
    </g>
  </g>

  <g transform="translate(56 293)">
    <rect width="1088" height="94" rx="14" fill="#fff6f6" stroke="#ee0000" stroke-width="2"/>
    <circle cx="32" cy="47" r="18" fill="#ee0000"/>
    <text x="32" y="53" fill="#ffffff" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700">2</text>
    <text x="66" y="39" fill="#151515" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700">Target model verifies</text>
    <text x="66" y="63" fill="#565656" font-family="Arial, Helvetica, sans-serif" font-size="14">The larger model checks the proposal in a batch.</text>
    <g transform="translate(630 24)">
      <rect width="92" height="42" rx="9" fill="#e7f6ed" stroke="#2e8b57"/><text x="46" y="27" text-anchor="middle" fill="#216e45" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700">The</text>
      <rect x="102" width="92" height="42" rx="9" fill="#e7f6ed" stroke="#2e8b57"/><text x="148" y="27" text-anchor="middle" fill="#216e45" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700">model</text>
      <rect x="204" width="92" height="42" rx="9" fill="#e7f6ed" stroke="#2e8b57"/><text x="250" y="27" text-anchor="middle" fill="#216e45" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700">is</text>
      <rect x="306" width="92" height="42" rx="9" fill="#fff0f0" stroke="#ee0000"/><text x="352" y="27" text-anchor="middle" fill="#ee0000" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700">quick</text>
    </g>
  </g>

  <g transform="translate(56 414)">
    <circle cx="9" cy="0" r="8" fill="#2e8b57"/>
    <text x="28" y="5" fill="#565656" font-family="Arial, Helvetica, sans-serif" font-size="13">Accepted tokens are kept.</text>
    <circle cx="257" cy="0" r="8" fill="#ee0000"/>
    <text x="276" y="5" fill="#565656" font-family="Arial, Helvetica, sans-serif" font-size="13">A mismatch is replaced by the target's answer.</text>
    <text x="814" y="5" fill="#151515" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700">The target model still decides.</text>
  </g>
</svg>
