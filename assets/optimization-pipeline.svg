<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 330" role="img" aria-labelledby="title description">
  <title id="title">The Part 2 optimization pipeline</title>
  <desc id="description">A five-step path from a baseline model through quantization, optimized serving, speculative decoding, and comparison.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#151515" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect x="1" y="1" width="1198" height="328" rx="24" fill="#ffffff" stroke="#d2d2d2" stroke-width="2"/>
  <text x="56" y="52" fill="#ee0000" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" letter-spacing="1.5">PART 2</text>
  <text x="56" y="91" fill="#151515" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700">Build the optimization pipeline</text>
  <text x="56" y="118" fill="#565656" font-family="Arial, Helvetica, sans-serif" font-size="16">Create a smaller target, then use a draft model to propose tokens.</text>
  <line x1="56" y1="143" x2="1144" y2="143" stroke="#ee0000" stroke-width="3"/>

  <g filter="url(#shadow)">
    <g transform="translate(56 178)">
      <rect width="190" height="105" rx="14" fill="#f6f6f6" stroke="#d2d2d2" stroke-width="2"/>
      <circle cx="30" cy="30" r="17" fill="#151515"/>
      <text x="30" y="36" fill="#ffffff" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700">01</text>
      <text x="58" y="36" fill="#151515" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">Baseline</text>
      <text x="22" y="68" fill="#565656" font-family="Arial, Helvetica, sans-serif" font-size="14">Qwen3-4B</text>
      <text x="22" y="88" fill="#767676" font-family="Arial, Helvetica, sans-serif" font-size="12">BF16 checkpoint</text>
    </g>

    <g transform="translate(290 178)">
      <rect width="190" height="105" rx="14" fill="#fff6f6" stroke="#ee0000" stroke-width="2"/>
      <circle cx="30" cy="30" r="17" fill="#ee0000"/>
      <text x="30" y="36" fill="#ffffff" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700">02</text>
      <text x="58" y="36" fill="#151515" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">Quantize</text>
      <text x="22" y="68" fill="#565656" font-family="Arial, Helvetica, sans-serif" font-size="14">Model-free PTQ</text>
      <text x="22" y="88" fill="#767676" font-family="Arial, Helvetica, sans-serif" font-size="12">FP8 dynamic scheme</text>
    </g>

    <g transform="translate(524 178)">
      <rect width="190" height="105" rx="14" fill="#f6f6f6" stroke="#d2d2d2" stroke-width="2"/>
      <circle cx="30" cy="30" r="17" fill="#151515"/>
      <text x="30" y="36" fill="#ffffff" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700">03</text>
      <text x="58" y="36" fill="#151515" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">Serve</text>
      <text x="22" y="68" fill="#565656" font-family="Arial, Helvetica, sans-serif" font-size="14">Load with vLLM</text>
      <text x="22" y="88" fill="#767676" font-family="Arial, Helvetica, sans-serif" font-size="12">compressed-tensors</text>
    </g>

    <g transform="translate(758 178)">
      <rect width="190" height="105" rx="14" fill="#f6f6f6" stroke="#d2d2d2" stroke-width="2"/>
      <circle cx="30" cy="30" r="17" fill="#151515"/>
      <text x="30" y="36" fill="#ffffff" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700">04</text>
      <text x="58" y="36" fill="#151515" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">Speculate</text>
      <text x="22" y="68" fill="#565656" font-family="Arial, Helvetica, sans-serif" font-size="14">Draft + target</text>
      <text x="22" y="88" fill="#767676" font-family="Arial, Helvetica, sans-serif" font-size="12">verify proposed tokens</text>
    </g>

    <g transform="translate(992 178)">
      <rect width="152" height="105" rx="14" fill="#f6f6f6" stroke="#d2d2d2" stroke-width="2"/>
      <circle cx="30" cy="30" r="17" fill="#151515"/>
      <text x="30" y="36" fill="#ffffff" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700">05</text>
      <text x="58" y="36" fill="#151515" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">Compare</text>
      <text x="22" y="68" fill="#565656" font-family="Arial, Helvetica, sans-serif" font-size="14">Same prompt</text>
      <text x="22" y="88" fill="#767676" font-family="Arial, Helvetica, sans-serif" font-size="12">simple timing check</text>
    </g>
  </g>

  <g fill="none" stroke="#ee0000" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M254 230h24l-8-7m8 7-8 7"/>
    <path d="M488 230h24l-8-7m8 7-8 7"/>
    <path d="M722 230h24l-8-7m8 7-8 7"/>
    <path d="M956 230h24l-8-7m8 7-8 7"/>
  </g>
</svg>
